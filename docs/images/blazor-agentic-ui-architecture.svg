<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Blazor agentic UI architecture</title>
  <desc id="desc">A Blazor web app connects through the AG-UI protocol to an ASP.NET Core server hosting Microsoft Agent Framework agents backed by Microsoft Foundry, with Aspire orchestrating the application.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17122b"/>
      <stop offset="1" stop-color="#2c1854"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".25"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 z" fill="#68d5ff"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#background)"/>
  <text x="70" y="82" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">Build agentic UI with .NET</text>
  <text x="70" y="122" fill="#c9b8ee" font-family="Segoe UI, Arial, sans-serif" font-size="22">Blazor components, AG-UI, Agent Framework, Aspire, and Microsoft Foundry</text>

  <rect x="55" y="170" width="1090" height="410" rx="24" fill="none" stroke="#9f7aea" stroke-width="3" stroke-dasharray="10 9"/>
  <rect x="78" y="150" width="175" height="42" rx="21" fill="#6f42c1"/>
  <text x="165" y="178" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Aspire AppHost</text>

  <g filter="url(#shadow)">
    <rect x="75" y="245" width="295" height="230" rx="22" fill="#ffffff"/>
    <circle cx="125" cy="300" r="28" fill="#512bd4"/>
    <text x="125" y="308" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">B</text>
    <text x="168" y="294" fill="#24133f" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Blazor Web App</text>
    <text x="108" y="350" fill="#4b3f5c" font-family="Segoe UI, Arial, sans-serif" font-size="18">Components.AI</text>
    <text x="108" y="386" fill="#4b3f5c" font-family="Segoe UI, Arial, sans-serif" font-size="18">UIAgent and content blocks</text>
    <text x="108" y="422" fill="#4b3f5c" font-family="Segoe UI, Arial, sans-serif" font-size="18">AGUIChatClient (IChatClient)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="455" y="245" width="290" height="230" rx="22" fill="#ffffff"/>
    <circle cx="505" cy="300" r="28" fill="#7b2cbf"/>
    <text x="505" y="307" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">API</text>
    <text x="548" y="294" fill="#24133f" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">ASP.NET Core</text>
    <text x="488" y="350" fill="#4b3f5c" font-family="Segoe UI, Arial, sans-serif" font-size="18">MapAGUIServer</text>
    <text x="488" y="386" fill="#4b3f5c" font-family="Segoe UI, Arial, sans-serif" font-size="18">MAF AIAgent and tools</text>
    <text x="488" y="422" fill="#4b3f5c" font-family="Segoe UI, Arial, sans-serif" font-size="18">AGUI.Server</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="830" y="245" width="295" height="230" rx="22" fill="#ffffff"/>
    <circle cx="880" cy="300" r="28" fill="#0078d4"/>
    <path d="M868 302c5-16 23-20 32-8 12 1 17 17 7 25h-34c-12-3-14-14-5-17z" fill="#ffffff"/>
    <text x="923" y="294" fill="#24133f" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Foundry</text>
    <text x="863" y="350" fill="#4b3f5c" font-family="Segoe UI, Arial, sans-serif" font-size="18">OpenAI-compatible API</text>
    <text x="863" y="386" fill="#4b3f5c" font-family="Segoe UI, Arial, sans-serif" font-size="18">Hosted model deployment</text>
    <text x="863" y="422" fill="#4b3f5c" font-family="Segoe UI, Arial, sans-serif" font-size="18">IChatClient provider</text>
  </g>

  <line x1="370" y1="330" x2="445" y2="330" stroke="#68d5ff" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="745" y1="330" x2="820" y2="330" stroke="#68d5ff" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="407" y="310" text-anchor="middle" fill="#dff7ff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">AG-UI</text>
  <text x="407" y="362" text-anchor="middle" fill="#dff7ff" font-family="Segoe UI, Arial, sans-serif" font-size="13">HTTP + SSE</text>
  <text x="782" y="310" text-anchor="middle" fill="#dff7ff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">IChatClient</text>

  <text x="600" y="625" text-anchor="middle" fill="#d8c9f4" font-family="Segoe UI, Arial, sans-serif" font-size="20">A shared abstraction connects model, agent, protocol, and interactive UI.</text>
</svg>
